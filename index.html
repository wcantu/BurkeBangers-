<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burke Bangers</title>
<meta name="description" content="Sixteen tracks straight from the hive.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<!-- ============================================================================
     EDIT ZONE — this is the only part you need to touch.
     Everything below this block is the machinery. Leave it alone.
     ========================================================================= -->
<script>

/* 1. Put your mp3 files in a folder called  music  next to this file.
      Folder layout on GitHub:

        index.html
        music/
          01.mp3
          02.mp3
          ...

   2. Fill in the list below. One line per song, 16 lines.

        file   = the exact filename, spelling and capitals included
        title  = what shows on the site. Leave "" and it uses the filename
        artist = who made it (this is your name slot)

      Example of a finished line:
        { file: "hallway hero.mp3", title: "Hallway Hero", artist: "Jaden R. & Mia P." },

      Note: if title is left blank, a filename like "01 - Hallway Hero.mp3"
      displays as "HALLWAY HERO". The leading number gets trimmed off.
      Want to keep it? Type the title in yourself.                              */

const SHOW_CREDITS = true;   // false hides every artist name on the site

const TRACKS = [
  { file: "Metro Boomin Bumpin.mp3", title: "Metro Boomin Bumpin", artist: "Mason X Brown " },
  { file: "02.mp3", title: "", artist: "" },
  { file: "03.mp3", title: "", artist: "" },
  { file: "04.mp3", title: "", artist: "" },
  { file: "05.mp3", title: "", artist: "" },
  { file: "06.mp3", title: "", artist: "" },
  { file: "07.mp3", title: "", artist: "" },
  { file: "08.mp3", title: "", artist: "" },
  { file: "09.mp3", title: "", artist: "" },
  { file: "10.mp3", title: "", artist: "" },
  { file: "11.mp3", title: "", artist: "" },
  { file: "12.mp3", title: "", artist: "" },
  { file: "13.mp3", title: "", artist: "" },
  { file: "14.mp3", title: "", artist: "" },
  { file: "15.mp3", title: "", artist: "" },
  { file: "16.mp3", title: "", artist: "" }
];

/* 3. Wording, if you want to change any of it. */
const COPY = {
  eyebrow:   "SIXTEEN TRACKS STRAIGHT FROM THE HIVE",
  title1:    "BURKE",
  title2:    "BANGERS",
  stickerTop:"TEACHER ADVISORY",
  stickerBot:"CERTIFIED BANGERS",
  footer:    "Made by students. Played at full volume."
};

const MUSIC_DIR = "music/";   // rename the folder here if you use a different one

</script>
<!-- ========================= END OF EDIT ZONE ============================== -->

<style>
:root{
  --void:#0A0A0F;
  --panel:#14141E;
  --panel-2:#1C1C2B;
  --line:#2B2B3D;
  --honey:#FFC61A;
  --honey-lite:#FFE27A;
  --hive:#2B5BFF;
  --sky:#7FA3FF;
  --chalk:#F4F4F2;
  --pixel: 'Press Start 2P', 'Courier New', monospace;
  --screen: 'VT323', 'Courier New', monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--void);
  color:var(--chalk);
  font-family:var(--screen);
  font-size:22px;
  line-height:1.35;
  min-height:100vh;
  overflow-x:hidden;
  background-image:
    linear-gradient(180deg, #101020 0%, var(--void) 55%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px);
}

/* faint CRT lines over everything */
.scanlines{
  position:fixed; inset:0; z-index:90; pointer-events:none;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px);
  opacity:.5;
}

.wrap{max-width:1120px; margin:0 auto; padding:0 20px}

/* ---------- hero ---------- */
.hero{padding:56px 0 28px; text-align:center; position:relative}
.eyebrow{
  font-family:var(--pixel); font-size:9px; color:var(--sky);
  letter-spacing:2px; margin-bottom:26px;
}
.title{
  font-family:var(--pixel);
  font-size:clamp(30px, 8.4vw, 68px);
  line-height:1.18;
  margin:0;
  color:var(--honey);
  text-shadow:
     4px 4px 0 var(--hive),
     8px 8px 0 #000;
  letter-spacing:1px;
}
.title span{display:block}
.title span:last-child{color:var(--chalk); text-shadow:4px 4px 0 var(--hive), 8px 8px 0 #000}

/* ---------- advisory sticker ---------- */
.sticker{
  display:inline-block; margin-top:34px;
  background:#000; border:4px solid var(--chalk);
  padding:14px 20px 0; transform:rotate(-3deg);
  box-shadow:8px 8px 0 rgba(0,0,0,.85);
}
.sticker-top{
  font-family:var(--pixel); font-size:clamp(11px,2.6vw,17px);
  color:var(--chalk); letter-spacing:2px;
}
.sticker-bar{
  margin:14px -20px 0; background:var(--honey); color:#000;
  font-family:var(--pixel); font-size:8px; letter-spacing:2px;
  padding:8px 20px;
}

/* ---------- bee stripe rule ---------- */
.stripe{
  height:14px; margin:44px 0 0;
  background:repeating-linear-gradient(-45deg,
    var(--honey) 0 18px, #000 18px 36px);
  border-top:3px solid #000; border-bottom:3px solid #000;
}

/* ---------- layout ---------- */
.deck{
  display:grid; gap:28px; padding:36px 0 60px;
  grid-template-columns:minmax(0,420px) minmax(0,1fr);
  align-items:start;
}
@media (max-width:880px){ .deck{grid-template-columns:1fr} }

.panel{
  background:var(--panel);
  border:4px solid #000;
  box-shadow:0 0 0 3px var(--line), 10px 10px 0 rgba(0,0,0,.7);
}
.panel-head{
  background:var(--hive); color:#fff; font-family:var(--pixel);
  font-size:9px; letter-spacing:2px; padding:11px 14px;
  border-bottom:4px solid #000;
  display:flex; justify-content:space-between; align-items:center; gap:10px;
}
.panel-head b{color:var(--honey); font-weight:normal}

/* ---------- stage: spotlight + record ---------- */
.stage{
  position:relative; overflow:hidden;
  padding:34px 22px 26px;
  background:
    radial-gradient(circle at 50% 42%,
      rgba(255,226,122,.13) 0 22%,
      rgba(255,226,122,.08) 22% 34%,
      rgba(255,226,122,.04) 34% 48%,
      transparent 48%),
    var(--panel);
}
.beam{
  position:absolute; top:-6%; left:50%; width:150%; height:86%;
  transform:translateX(-50%);
  clip-path:polygon(38% 0, 62% 0, 88% 100%, 12% 100%);
  background:linear-gradient(180deg,
    rgba(255,226,122,.30) 0 18%,
    rgba(255,226,122,.21) 18% 36%,
    rgba(255,226,122,.14) 36% 54%,
    rgba(255,226,122,.08) 54% 72%,
    rgba(255,226,122,.03) 72% 88%,
    transparent 88%);
  pointer-events:none;
  transition:opacity .45s steps(4);
  opacity:.62;
}
.stage.is-playing .beam{opacity:1}
.mote{
  position:absolute; width:4px; height:4px; background:var(--honey-lite);
  opacity:.5; pointer-events:none;
  animation:fall linear infinite;
}
@keyframes fall{
  from{transform:translateY(-20px)}
  to{transform:translateY(340px)}
}

.turntable{position:relative; width:min(384px,80%); margin:6px auto 0}
#record{
  display:block; width:100%; height:auto;
  image-rendering:pixelated; image-rendering:crisp-edges;
  filter:drop-shadow(0 14px 0 rgba(0,0,0,.55));
}
/* pixel tonearm */
.arm{
  position:absolute; top:2%; right:-2%; width:46%; height:10px;
  transform-origin:100% 50%; transform:rotate(38deg);
  transition:transform .6s steps(6);
  pointer-events:none;
}
.stage.is-playing .arm{transform:rotate(20deg)}
.arm-bar{
  position:absolute; right:14px; top:2px; left:16px; height:6px;
  background:var(--line); border:2px solid #000;
}
.arm-pivot{
  position:absolute; right:0; top:-8px; width:24px; height:24px;
  background:var(--honey); border:3px solid #000;
}
.arm-head{
  position:absolute; left:0; top:-4px; width:18px; height:16px;
  background:var(--chalk); border:3px solid #000;
}

/* ---------- now playing ---------- */
.readout{
  margin:24px 0 0; background:#000; border:3px solid var(--line);
  padding:14px 16px; position:relative; z-index:2;
}
.readout .label{font-family:var(--pixel); font-size:8px; color:var(--sky); letter-spacing:2px}
.readout .now{
  font-size:30px; line-height:1.1; margin-top:8px; color:var(--honey);
  text-transform:uppercase; word-break:break-word;
}
.readout .by{font-size:20px; color:var(--sky); margin-top:2px; min-height:1px}

/* equalizer */
.eq{display:flex; gap:3px; align-items:flex-end; height:16px; margin-top:12px}
.eq i{display:block; width:5px; height:3px; background:var(--line)}
.stage.is-playing .eq i{background:var(--honey); animation:bounce .7s steps(3) infinite alternate}
@keyframes bounce{ from{height:3px} to{height:16px} }

/* ---------- transport ---------- */
.bar{
  margin-top:16px; height:20px; background:#000; border:3px solid var(--line);
  position:relative; cursor:pointer; z-index:2;
}
.bar:focus-visible{outline:3px solid var(--honey); outline-offset:3px}
.bar-fill{
  position:absolute; inset:0 auto 0 0; width:0%;
  background:var(--honey);
  background-image:repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,0,0,.55) 8px 10px);
}
.times{
  display:flex; justify-content:space-between; margin-top:6px;
  font-family:var(--pixel); font-size:8px; color:var(--sky);
}

.controls{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; position:relative; z-index:2}
.btn{
  font-family:var(--pixel); font-size:10px; color:#000; cursor:pointer;
  background:var(--honey); border:3px solid #000; padding:12px 14px;
  box-shadow:4px 4px 0 #000; transition:none;
}
.btn:hover{background:var(--honey-lite)}
.btn:active{transform:translate(4px,4px); box-shadow:0 0 0 #000}
.btn:focus-visible{outline:3px solid var(--sky); outline-offset:3px}
.btn.wide{flex:1; min-width:104px}
.btn.ghost{background:var(--panel-2); color:var(--chalk); border-color:var(--line); box-shadow:4px 4px 0 #000}
.btn.ghost:hover{background:var(--line)}
.btn.on{background:var(--hive); color:#fff; border-color:#000}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.btn[disabled]:active{transform:none; box-shadow:4px 4px 0 #000}

.vol{display:flex; align-items:center; gap:10px; margin-top:16px; position:relative; z-index:2}
.vol span{font-family:var(--pixel); font-size:8px; color:var(--sky)}
input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:14px;
  background:#000; border:3px solid var(--line); cursor:pointer;
}
input[type=range]:focus-visible{outline:3px solid var(--honey); outline-offset:3px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:14px; height:22px; background:var(--honey); border:3px solid #000;
}
input[type=range]::-moz-range-thumb{
  width:14px; height:22px; background:var(--honey); border:3px solid #000; border-radius:0;
}

/* ---------- track list ---------- */
.rows{list-style:none; margin:0; padding:0}
.rows li{border-bottom:3px solid #000}
.rows li:last-child{border-bottom:0}
.row{
  width:100%; display:grid; gap:14px; align-items:center;
  grid-template-columns:44px minmax(0,1fr) auto;
  background:var(--panel); border:0; color:var(--chalk);
  font-family:var(--screen); font-size:22px; text-align:left;
  padding:14px 16px; cursor:pointer;
}
.row:hover{background:var(--panel-2)}
.row:focus-visible{outline:3px solid var(--honey); outline-offset:-3px}
.row .num{font-family:var(--pixel); font-size:11px; color:var(--sky)}
.row .name{text-transform:uppercase; line-height:1.15; word-break:break-word}
.row .who{font-size:19px; color:var(--sky); text-transform:none}
.row .len{font-family:var(--pixel); font-size:9px; color:var(--line)}
.row.playing{background:var(--honey); color:#000}
.row.playing .num,
.row.playing .who,
.row.playing .len{color:#000}
.row.empty{cursor:not-allowed; background:var(--panel)}
.row.empty .name{color:var(--line)}
.row.empty .num{color:var(--line)}
.tag{
  font-family:var(--pixel); font-size:8px; color:#000; background:var(--line);
  padding:5px 7px; white-space:nowrap;
}
.hint{
  font-family:var(--screen); font-size:19px; color:var(--sky);
  padding:16px; border-top:3px solid #000; background:var(--panel-2);
}

footer{
  border-top:3px solid #000;
  background:repeating-linear-gradient(-45deg, var(--honey) 0 18px, #000 18px 36px);
  height:14px;
}
.sig{
  text-align:center; padding:24px 20px 46px; color:var(--sky);
  font-family:var(--pixel); font-size:8px; letter-spacing:1px; line-height:2.2;
}

@media (prefers-reduced-motion:reduce){
  .mote{display:none}
  .stage.is-playing .eq i{animation:none; height:10px}
  .arm{transition:none}
}
</style>
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="title"><span id="t1"></span><span id="t2"></span></h1>
    <div class="sticker">
      <div class="sticker-top" id="stickTop"></div>
      <div class="sticker-bar" id="stickBot"></div>
    </div>
  </header>
</div>

<div class="stripe" aria-hidden="true"></div>

<div class="wrap">
  <main class="deck">

    <!-- turntable -->
    <section class="panel">
      <div class="panel-head"><span>TURNTABLE</span><b id="deckState">STOPPED</b></div>
      <div class="stage" id="stage">
        <div class="beam" aria-hidden="true"></div>
        <div id="motes" aria-hidden="true"></div>

        <div class="turntable">
          <canvas id="record" width="128" height="128" role="img" aria-label="Spinning pixel-art record"></canvas>
          <div class="arm" aria-hidden="true">
            <div class="arm-bar"></div>
            <div class="arm-pivot"></div>
            <div class="arm-head"></div>
          </div>
        </div>

        <div class="readout">
          <div class="label">NOW PLAYING</div>
          <div class="now" id="npTitle">—</div>
          <div class="by" id="npArtist"></div>
          <div class="eq" id="eq" aria-hidden="true"></div>
        </div>

        <div class="bar" id="bar" role="slider" tabindex="0"
             aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar-fill" id="barFill"></div>
        </div>
        <div class="times"><span id="tCur">0:00</span><span id="tEnd">0:00</span></div>

        <div class="controls">
          <button class="btn ghost" id="prev" type="button">|&lt;&lt;</button>
          <button class="btn wide" id="play" type="button">PLAY</button>
          <button class="btn ghost" id="next" type="button">&gt;&gt;|</button>
        </div>
        <div class="controls">
          <button class="btn ghost" id="shuffle" type="button" aria-pressed="false">SHUFFLE</button>
          <button class="btn ghost" id="repeat" type="button">REPEAT: ALL</button>
        </div>

        <div class="vol">
          <span>VOL</span>
          <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
        </div>
      </div>
    </section>

    <!-- tracklist -->
    <section class="panel">
      <div class="panel-head"><span>THE TAPE</span><b id="countLine"></b></div>
      <ul class="rows" id="rows"></ul>
      <p class="hint" id="hint"></p>
    </section>

  </main>
</div>

<footer aria-hidden="true"></footer>
<p class="sig" id="sig"></p>

<script>
(function(){
"use strict";

var reduceMotion = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------------------------------------------------- copy */
document.getElementById('eyebrow').textContent  = COPY.eyebrow;
document.getElementById('t1').textContent       = COPY.title1;
document.getElementById('t2').textContent       = COPY.title2;
document.getElementById('stickTop').textContent = COPY.stickerTop;
document.getElementById('stickBot').textContent = COPY.stickerBot;
document.getElementById('sig').textContent      = COPY.footer;

/* ---------------------------------------------------------- helpers */
function niceName(file){
  var n = file.replace(/\.[^.]+$/, '');       // drop extension
  n = n.replace(/^\d{1,2}\s*[-_.]\s*|^\d{1,2}\s+/, ''); // drop leading track number
  n = n.replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
  return n || file;
}
function clock(s){
  if (!isFinite(s) || s < 0) s = 0;
  var m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ':' + (r < 10 ? '0' : '') + r;
}

/* ---------------------------------------------------------- model */
var list = TRACKS.map(function(t, i){
  return {
    i: i,
    file: t.file,
    src: encodeURI(MUSIC_DIR + t.file),
    title: (t.title && t.title.trim()) ? t.title.trim() : niceName(t.file),
    artist: (t.artist || '').trim(),
    ok: null,          // null = unknown, true = file found, false = missing
    dur: 0,
    el: null
  };
});

var audio = new Audio();
audio.preload = 'metadata';
audio.volume = 0.8;

var current = -1, shuffle = false, repeatMode = 'all', bag = [];

/* ---------------------------------------------------------- track list UI */
var rowsEl = document.getElementById('rows');
list.forEach(function(tr){
  var li = document.createElement('li');
  var b  = document.createElement('button');
  b.type = 'button';
  b.className = 'row';

  var num = document.createElement('span');
  num.className = 'num';
  num.textContent = (tr.i + 1 < 10 ? '0' : '') + (tr.i + 1);

  var mid = document.createElement('span');
  var name = document.createElement('span');
  name.className = 'name';
  name.textContent = tr.title;
  mid.appendChild(name);

  if (SHOW_CREDITS && tr.artist){
    var who = document.createElement('span');
    who.className = 'who';
    who.textContent = tr.artist;
    mid.appendChild(document.createElement('br'));
    mid.appendChild(who);
  }

  var right = document.createElement('span');
  right.className = 'len';
  right.textContent = '--:--';

  b.appendChild(num); b.appendChild(mid); b.appendChild(right);
  b.addEventListener('click', function(){ if (tr.ok !== false) select(tr.i, true); });

  li.appendChild(b);
  rowsEl.appendChild(li);
  tr.el = b;
  tr.lenEl = right;
});

/* check which files actually exist, two at a time so we don't flood the network */
var probeAt = 0;
function probeNext(){
  if (probeAt >= list.length) return;
  var tr = list[probeAt++];
  var a = new Audio();
  a.preload = 'metadata';
  var done = false;
  function finish(found){
    if (done) return; done = true;
    tr.ok = found;
    if (found){
      tr.dur = a.duration;
      tr.lenEl.textContent = clock(a.duration);
    } else {
      tr.el.classList.add('empty');
      tr.lenEl.textContent = '';
      tr.lenEl.className = 'tag';
      tr.lenEl.textContent = 'NO FILE YET';
    }
    a.src = '';
    updateCount();
    probeNext();
  }
  a.addEventListener('loadedmetadata', function(){ finish(true); });
  a.addEventListener('error', function(){ finish(false); });
  setTimeout(function(){ finish(tr.ok === null ? false : tr.ok); }, 12000);
  a.src = tr.src;
}
probeNext(); probeNext();

function updateCount(){
  var found = list.filter(function(t){ return t.ok === true; }).length;
  var missing = list.filter(function(t){ return t.ok === false; }).length;
  document.getElementById('countLine').textContent = found + '/' + list.length + ' LOADED';
  document.getElementById('hint').textContent = 'All sixteen accounted for. Hit play.';
}
updateCount();

/* ---------------------------------------------------------- playback */
var npTitle = document.getElementById('npTitle'),
    npArtist = document.getElementById('npArtist'),
    stage = document.getElementById('stage'),
    deckState = document.getElementById('deckState'),
    playBtn = document.getElementById('play'),
    barFill = document.getElementById('barFill'),
    bar = document.getElementById('bar'),
    tCur = document.getElementById('tCur'),
    tEnd = document.getElementById('tEnd');

function select(i, autoplay){
  if (i < 0 || i >= list.length) return;
  var tr = list[i];
  current = i;
  audio.src = tr.src;
  npTitle.textContent = tr.title;
  npArtist.textContent = (SHOW_CREDITS && tr.artist) ? 'by ' + tr.artist : '';
  list.forEach(function(t){ t.el.classList.toggle('playing', t.i === i); });
  barFill.style.width = '0%';
  tCur.textContent = '0:00';
  tEnd.textContent = clock(tr.dur);
  if (autoplay) audio.play().catch(function(){ /* browser blocked it; user can tap play */ });
}

function playable(){ return list.filter(function(t){ return t.ok !== false; }); }

function step(dir){
  var pool = playable();
  if (!pool.length) return;
  if (shuffle && dir > 0){
    if (!bag.length) bag = pool.map(function(t){ return t.i; });
    if (bag.length > 1){
      var k = bag.indexOf(current);
      if (k > -1) bag.splice(k, 1);
    }
    var pick = bag.splice(Math.floor(Math.random() * bag.length), 1)[0];
    select(pick, true);
    return;
  }
  var idx = pool.findIndex(function(t){ return t.i === current; });
  if (idx === -1) idx = dir > 0 ? -1 : 0;
  var nextIdx = (idx + dir + pool.length) % pool.length;
  select(pool[nextIdx].i, true);
}

playBtn.addEventListener('click', function(){
  if (current === -1){
    var first = playable()[0];
    if (!first){ npTitle.textContent = 'NO FILES FOUND'; return; }
    select(first.i, true);
    return;
  }
  if (audio.paused) audio.play().catch(function(){}); else audio.pause();
});
document.getElementById('next').addEventListener('click', function(){ step(1); });
document.getElementById('prev').addEventListener('click', function(){
  if (audio.currentTime > 3){ audio.currentTime = 0; return; }
  step(-1);
});

var shuffleBtn = document.getElementById('shuffle');
shuffleBtn.addEventListener('click', function(){
  shuffle = !shuffle;
  bag = [];
  shuffleBtn.classList.toggle('on', shuffle);
  shuffleBtn.setAttribute('aria-pressed', String(shuffle));
});

var repeatBtn = document.getElementById('repeat');
repeatBtn.addEventListener('click', function(){
  repeatMode = repeatMode === 'all' ? 'one' : (repeatMode === 'one' ? 'off' : 'all');
  repeatBtn.textContent = 'REPEAT: ' + repeatMode.toUpperCase();
  repeatBtn.classList.toggle('on', repeatMode !== 'off');
});

document.getElementById('vol').addEventListener('input', function(e){
  audio.volume = e.target.value / 100;
});

audio.addEventListener('play', function(){
  stage.classList.add('is-playing');
  playBtn.textContent = 'PAUSE';
  deckState.textContent = 'SPINNING';
});
audio.addEventListener('pause', function(){
  stage.classList.remove('is-playing');
  playBtn.textContent = 'PLAY';
  deckState.textContent = 'PAUSED';
});
audio.addEventListener('ended', function(){
  if (repeatMode === 'one'){ audio.currentTime = 0; audio.play(); return; }
  var pool = playable();
  var last = pool.length && pool[pool.length - 1].i === current;
  if (repeatMode === 'off' && last && !shuffle){ deckState.textContent = 'STOPPED'; return; }
  step(1);
});
audio.addEventListener('error', function(){
  if (current > -1){
    list[current].ok = false;
    list[current].el.classList.add('empty');
    npTitle.textContent = 'FILE NOT FOUND';
    npArtist.textContent = 'Looked for ' + MUSIC_DIR + list[current].file;
    updateCount();
  }
});
audio.addEventListener('loadedmetadata', function(){
  if (current > -1){
    list[current].dur = audio.duration;
    list[current].lenEl.textContent = clock(audio.duration);
  }
  tEnd.textContent = clock(audio.duration);
});
audio.addEventListener('timeupdate', function(){
  var p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  barFill.style.width = p + '%';
  bar.setAttribute('aria-valuenow', Math.round(p));
  tCur.textContent = clock(audio.currentTime);
});

function seekFromEvent(e){
  if (!audio.duration) return;
  var box = bar.getBoundingClientRect();
  var x = (e.clientX - box.left) / box.width;
  audio.currentTime = Math.max(0, Math.min(1, x)) * audio.duration;
}
bar.addEventListener('click', seekFromEvent);
bar.addEventListener('keydown', function(e){
  if (!audio.duration) return;
  if (e.key === 'ArrowRight'){ audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); e.preventDefault(); }
  if (e.key === 'ArrowLeft'){ audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
});

document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'button' || tag === 'textarea') return;
  if (e.code === 'Space'){ e.preventDefault(); playBtn.click(); }
});

/* ---------------------------------------------------------- the record */
var cv = document.getElementById('record'),
    ctx = cv.getContext('2d'),
    S = 128, TAU = Math.PI * 2,
    img = ctx.createImageData(S, S),
    px = img.data,
    rad = new Float32Array(S * S),
    ang = new Float32Array(S * S),
    lit = new Float32Array(S * S);

(function precompute(){
  for (var y = 0; y < S; y++){
    for (var x = 0; x < S; x++){
      var i = y * S + x, dx = x - 63.5, dy = y - 63.5;
      rad[i] = Math.sqrt(dx * dx + dy * dy);
      var a = Math.atan2(dy, dx); if (a < 0) a += TAU;
      ang[i] = a;
      /* fixed spotlight from upper-left, quantised into 5 bands for that dithered look */
      var lx = x - 40, ly = y - 26;
      var d = Math.sqrt(lx * lx + ly * ly);
      var v = 1 - d / 104; if (v < 0) v = 0;
      lit[i] = Math.round(v * v * 4) / 4;
    }
  }
})();

var VINYL=[16,16,26], G_HI=[32,32,50], G_LO=[10,10,17], RIM=[44,44,62],
    BLUE=[43,91,255], HONEY=[255,198,26], INK=[10,10,15], HOLE=[5,5,9],
    STREAK=[255,198,26], STREAK2=[128,102,24];

function paint(rot){
  for (var i = 0; i < S * S; i++){
    var r = rad[i], o = i * 4;
    if (r > 63){ px[o+3] = 0; continue; }

    var a = ang[i] - rot; a = a % TAU; if (a < 0) a += TAU;
    var c;

    if (r > 61){
      c = RIM;
    } else if (r > 21){
      var g = Math.floor(r) % 5;
      c = g === 0 ? G_HI : (g === 2 ? G_LO : VINYL);
      if (r > 43 && r < 46) c = G_HI;                       // gap between sides
      var d0 = Math.min(a, TAU - a);
      if (d0 < 0.05) c = STREAK;                             // the mark that shows it spinning
      else if (Math.abs(a - Math.PI) < 0.035) c = STREAK2;
    } else if (r > 19){
      c = INK;                                               // label outline
    } else if (r > 12){
      c = (Math.floor(a / TAU * 8) & 1) ? HONEY : BLUE;      // bee-striped label ring
    } else if (r > 4.5){
      c = BLUE;
    } else if (r > 2){
      c = INK;
    } else {
      c = HOLE;
    }

    var L = lit[i];
    px[o]   = Math.min(255, c[0] + L * 46);
    px[o+1] = Math.min(255, c[1] + L * 42);
    px[o+2] = Math.min(255, c[2] + L * 28);
    px[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

var rot = 0, speed = 0, last = 0;
function frame(now){
  var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
  last = now;
  var target = audio.paused ? 0 : 2.2;                 // radians per second
  speed += (target - speed) * Math.min(1, dt * 2.5);   // spin up / wind down like a real deck
  if (speed < 0.004) speed = 0;
  rot = (rot + speed * dt) % TAU;
  paint(rot);
  requestAnimationFrame(frame);
}

if (reduceMotion){
  paint(0.6);
  audio.addEventListener('play',  function(){ paint(1.9); });
  audio.addEventListener('pause', function(){ paint(0.6); });
} else {
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------- dust in the beam */
if (!reduceMotion){
  var motes = document.getElementById('motes');
  for (var m = 0; m < 8; m++){
    var s = document.createElement('span');
    s.className = 'mote';
    s.style.left = (20 + Math.random() * 60) + '%';
    s.style.top = (Math.random() * 40) + '%';
    s.style.animationDuration = (7 + Math.random() * 9) + 's';
    s.style.animationDelay = (-Math.random() * 12) + 's';
    motes.appendChild(s);
  }
}

/* ---------------------------------------------------------- equalizer bars */
var eq = document.getElementById('eq');
for (var b2 = 0; b2 < 14; b2++){
  var bar2 = document.createElement('i');
  bar2.style.animationDuration = (0.4 + Math.random() * 0.6).toFixed(2) + 's';
  bar2.style.animationDelay = (-Math.random()).toFixed(2) + 's';
  eq.appendChild(bar2);
}

})();
</script>
